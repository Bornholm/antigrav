name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDL_VERSION: 3.4.16

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 ne fournit pas SDL3 : le jeu le compile et l'embarque.
      # Ces paquets sont les en-têtes dont SDL a besoin pour X11, Wayland
      # et le son.
      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build glslc pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl-dev libgles-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev

      - name: Restaurer l'archive de SDL
        uses: actions/cache@v4
        with:
          path: .cache/sdl
          key: sdl-${{ env.SDL_VERSION }}

      - name: Télécharger SDL
        run: |
          mkdir -p .cache/sdl
          test -f .cache/sdl/SDL3-$SDL_VERSION.tar.gz || curl -fL --retry 3 \
            -o .cache/sdl/SDL3-$SDL_VERSION.tar.gz \
            https://www.libsdl.org/release/SDL3-$SDL_VERSION.tar.gz

      - name: Configurer
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DANTIGRAV_BUNDLED_SDL=ON \
            -DANTIGRAV_SDL_ARCHIVE=$PWD/.cache/sdl/SDL3-$SDL_VERSION.tar.gz

      - name: Compiler
        run: cmake --build build

      - name: Tester
        run: ctest --test-dir build --output-on-failure

      - name: Préparer l'archive
        run: |
          mkdir -p dist/antigrav-linux-x86_64
          cp build/antigrav README.md dist/antigrav-linux-x86_64/
          strip dist/antigrav-linux-x86_64/antigrav
          tar -C dist -czf dist/antigrav-linux-x86_64.tar.gz antigrav-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: antigrav-linux-x86_64
          path: dist/antigrav-linux-x86_64.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le dépôt n'a pas de wrapper Gradle : la version est fixée ici.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Installer le NDK et CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Restaurer l'archive de SDL
        uses: actions/cache@v4
        with:
          path: .cache/sdl
          key: sdl-${{ env.SDL_VERSION }}

      - name: Télécharger SDL
        run: |
          mkdir -p .cache/sdl
          test -f .cache/sdl/SDL3-$SDL_VERSION.tar.gz || curl -fL --retry 3 \
            -o .cache/sdl/SDL3-$SDL_VERSION.tar.gz \
            https://www.libsdl.org/release/SDL3-$SDL_VERSION.tar.gz

      # Sans le secret, par exemple sur une pull request venue d'un fork,
      # l'APK est signé avec la clé de debug du runner.
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/antigrav.keystore"
            echo "ANTIGRAV_KEYSTORE=$RUNNER_TEMP/antigrav.keystore" >> "$GITHUB_ENV"
            echo "Signature avec la clé fixe."
          else
            echo "::notice::Secret ANDROID_KEYSTORE_BASE64 absent, signature avec la clé de debug du runner."
          fi

      - name: Compiler l'APK
        working-directory: android
        env:
          ANTIGRAV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANTIGRAV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANTIGRAV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANTIGRAV_VERSION_CODE: ${{ github.run_number }}
        # Un tag produit la variante release, numérotée d'après le tag.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export ANTIGRAV_VERSION="${GITHUB_REF_NAME#v}"
            gradle assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../antigrav.apk
          else
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../antigrav.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: antigrav-android
          path: antigrav.apk
          if-no-files-found: error

  # Sur un tag v*, publie les deux fichiers dans une release GitHub.
  release:
    if: github.ref_type == 'tag'
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mv artifacts/antigrav-linux-x86_64/antigrav-linux-x86_64.tar.gz "antigrav-$TAG-linux-x86_64.tar.gz"
          mv artifacts/antigrav-android/antigrav.apk "antigrav-$TAG-android.apk"
          sha256sum "antigrav-$TAG-linux-x86_64.tar.gz" "antigrav-$TAG-android.apk" > SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" antigrav-* SHA256SUMS --clobber
          else
            gh release create "$TAG" antigrav-* SHA256SUMS --title "$TAG" --generate-notes --verify-tag
          fi
